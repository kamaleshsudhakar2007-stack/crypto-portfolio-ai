spring.application.name=crypto-portfolio-api
server.port=${PORT:8080}
# Loads backend/.env if present (KEY=VALUE lines). Optional.
spring.config.import=optional:file:.env[.properties]

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/crypto_portfolio?serverSelectionTimeoutMS=3000}

app.coingecko.api-key=${COINGECKO_API_KEY:}
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Enables POST /api/dev/seed and DELETE /api/dev/reset (demo helpers). Set false for any shared deployment.
app.dev-endpoints=${DEV_ENDPOINTS:true}

server.error.include-message=never
server.error.include-stacktrace=never
